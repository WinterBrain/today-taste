<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>참여 의사 확인 · 오늘의 취향</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/css/style.css"></head><body class="link-page"><div class="link-shell" id="box">불러오는 중...</div><script>const t=location.pathname.split('/').pop();async function load(){let r=await fetch('/api/public/participation/'+t),j=await r.json();if(!r.ok)return box.innerHTML='<h2>링크를 확인할 수 없습니다.</h2><p>'+j.error+'</p>';box.innerHTML=`<h2>${j.name} 님, 참여하시겠어요?</h2><p class="link-muted">${j.group_name}<br>${j.date} ${j.start_time}~${j.end_time}</p><p>참여를 선택하면 10시간 입금 기한이 시작됩니다.</p><div class="link-row"><button class="link-btn yes" onclick="go(true)">참여할게요</button><button class="link-btn no" onclick="go(false)">이번에는 참여하지 않을게요</button></div>`}async function go(v){let r=await fetch('/api/public/participation/'+t,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accept:v})}),j=await r.json();if(!r.ok)return alert(j.error);box.innerHTML=v?`<h2>참여 의사를 확인했어요.</h2><p>입금 기한: <b>${j.paymentDeadline}</b></p><p class="link-muted">현재 버전은 PG 연동 전이라 운영자가 입금을 수동 확인합니다.</p>`:`<h2>참여 포기로 처리했어요.</h2>`}load();</script></body></html>
