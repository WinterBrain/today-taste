<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘의 취향 운영콘솔</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/css/admin.css"></head><body><div id="root"></div><script>
const S={token:localStorage.getItem('tt_token')||'',user:null,page:'applications',groups:[],operators:[],schedules:[],apps:[],refunds:[],reviews:[]};
const api=async(url,opt={})=>{opt.headers={...(opt.headers||{}),'Content-Type':'application/json'};if(S.token)opt.headers.Authorization='Bearer '+S.token;const r=await fetch(url,opt);let j={};try{j=await r.json()}catch{}if(!r.ok){if(r.status===401&&S.token){localStorage.removeItem('tt_token');S.token='';S.user=null;render();}throw new Error(j.error||'요청 실패');}return j};
const won=n=>(Number(n)||0).toLocaleString('ko-KR')+'원';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function badge(st){let c=['확정','참석완료','평가완료'].includes(st)?'b-green':['입금대기','승인'].includes(st)?'b-amber':['거절','자동취소','환불필요'].includes(st)?'b-red':'';return `<span class="badge ${c}">${esc(st)}</span>`}
function toast(m){let e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2300)}
async function boot(){try{const st=await api('/api/auth/setup-status');if(S.token){try{S.user=(await api('/api/auth/me')).user}catch{S.token=''}}S.needsBootstrap=st.needsBootstrap;render();if(S.user)loadPage()}catch(e){document.getElementById('root').innerHTML='<div class="loginShell"><div class="loginCard"><h1>서버 연결 실패</h1><p>'+esc(e.message)+'</p></div></div>'}}
function render(){if(!S.user)return renderLogin();document.getElementById('root').innerHTML=`<div class="app"><div class="topbar"><div class="brand" style="margin:0">오늘의<i>·</i>취향 <span style="font:500 12px 'Noto Sans KR';color:var(--faint)">운영콘솔</span></div><span class="role">${S.user.role==='admin'?'총괄자':'운영자'}</span><div class="who"><b>${esc(S.user.name)}</b><button class="btn outline" onclick="logout()">로그아웃</button></div></div><div class="shell"><nav class="nav">${navBtn('applications','📋 신청자')}${navBtn('schedules','🗓️ 일정')}${S.user.role==='admin'?navBtn('groups','🏷️ 모임체')+navBtn('operators','🔑 운영자')+navBtn('refunds','💸 환불')+navBtn('reviews','⭐ 평가'):''}</nav><main class="main" id="main"><div class="notice">데이터를 불러오는 중입니다.</div></main></div></div>`}
function navBtn(k,t){return `<button class="${S.page===k?'on':''}" onclick="go('${k}')">${t}</button>`}
function renderLogin(){document.getElementById('root').innerHTML=`<div class="loginShell"><div class="loginCard"><div class="brand">오늘의<i>·</i>취향</div><span class="eyebrow">실제 DB 연동 운영콘솔</span><h1>${S.needsBootstrap?'초기 총괄자 계정 만들기':'운영콘솔 로그인'}</h1><p class="muted">${S.needsBootstrap?'처음 한 번만 총괄자 계정을 생성합니다. 이후 운영자 계정은 총괄자가 콘솔에서 생성합니다.':'총괄자 또는 운영자 계정으로 로그인하세요.'}</p>${S.needsBootstrap?`<div class="field"><label>이름</label><input class="input" id="name"></div>`:''}<div class="field"><label>아이디</label><input class="input" id="username"></div><div class="field"><label>비밀번호</label><input class="input" id="password" type="password" placeholder="8자 이상"></div><button class="btn primary block" style="margin-top:18px" onclick="${S.needsBootstrap?'bootstrapAdmin()':'login()'}">${S.needsBootstrap?'총괄자 계정 생성':'로그인'}</button><div class="notice">공개 회원가입은 두지 않았습니다. 설계안대로 신청자는 로그인 없이 신청하고, 운영자 계정은 총괄자가 직접 발급합니다.</div></div></div>`}
async function bootstrapAdmin(){try{await api('/api/auth/bootstrap',{method:'POST',body:JSON.stringify({name:val('name'),username:val('username'),password:val('password')})});S.needsBootstrap=false;toast('총괄자 계정을 만들었습니다. 로그인해 주세요.');render()}catch(e){alert(e.message)}}
async function login(){try{let j=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:val('username'),password:val('password')})});S.token=j.token;S.user=j.user;S.page='applications';localStorage.setItem('tt_token',S.token);render();loadPage()}catch(e){alert(e.message)}}
function logout(){localStorage.removeItem('tt_token');S.token='';S.user=null;S.page='applications';render()};function val(id){return document.getElementById(id)?.value||''}
async function go(p){const adminPages=['groups','operators','refunds','reviews'];if(S.user&&S.user.role!=='admin'&&adminPages.includes(p))p='applications';S.page=p;render();await loadPage()}
async function loadBase(){let [g,s]=await Promise.all([api('/api/admin/groups'),api('/api/admin/schedules')]);S.groups=g.groups;S.schedules=s.schedules;if(S.user.role==='admin'){S.operators=(await api('/api/admin/operators')).operators}}
async function loadPage(){try{if(S.user&&S.user.role!=='admin'&&['groups','operators','refunds','reviews'].includes(S.page))S.page='applications';await loadBase();if(S.page==='applications'){S.apps=(await api('/api/admin/applications')).applications;drawApps()}else if(S.page==='schedules')drawSchedules();else if(S.page==='groups')drawGroups();else if(S.page==='operators')drawOperators();else if(S.page==='refunds'){S.refunds=(await api('/api/admin/refunds')).refunds;drawRefunds()}else if(S.page==='reviews'){S.reviews=(await api('/api/admin/reviews')).reviews;drawReviews()}}catch(e){document.getElementById('main').innerHTML='<div class="notice">'+esc(e.message)+'</div>'}}
function head(ey,title,sub=''){return `<div class="pageHead"><span class="eyebrow">${ey}</span><h1>${title}</h1><p class="muted">${sub}</p></div>`}
function drawApps(){let pending=S.apps.filter(a=>a.status==='접수').length,confirmed=S.apps.filter(a=>a.status==='확정').length,refund=S.apps.filter(a=>a.status==='환불필요').length;document.getElementById('main').innerHTML=head('운영','신청자 목록','승인·거절, 참여 의사 확인, 입금 확인과 참석 처리를 실제 DB에 저장합니다.')+`<div class="stats"><div class="stat"><b>${S.apps.length}</b><span>전체</span></div><div class="stat"><b>${pending}</b><span>승인 대기</span></div><div class="stat"><b>${confirmed}</b><span>확정</span></div><div class="stat"><b>${refund}</b><span>환불 필요</span></div></div><div class="toolbar"><select class="input" id="appStatus" onchange="filterApps()"><option value="">전체 상태</option>${['접수','승인','입금대기','확정','거절','참여포기','자동취소','환불필요','참석완료','불참','평가완료'].map(x=>`<option>${x}</option>`).join('')}</select><input class="input" id="appQ" placeholder="이름/전화번호" oninput="filterApps()"></div><div class="tableWrap"><table class="table"><thead><tr><th>신청일</th><th>모임/일정</th><th>신청자</th><th>연락처</th><th>상태</th><th>처리</th></tr></thead><tbody id="appRows"></tbody></table></div>`;filterApps()}
function filterApps(){let st=val('appStatus'),q=val('appQ');let list=S.apps.filter(a=>(!st||a.status===st)&&(!q||a.name.includes(q)||a.phone.includes(q)));document.getElementById('appRows').innerHTML=list.map(a=>`<tr><td>${esc(a.applied_at)}</td><td><b>${esc(a.icon)} ${esc(a.group_name)}</b><div class="meta">${esc(a.date)} ${esc(a.start_time)}~${esc(a.end_time)}</div></td><td><b>${esc(a.name)}</b><div class="meta">${a.age}세 · ${esc(a.job)} · ${esc(a.mbti)}</div></td><td>${esc(a.phone)}</td><td>${badge(a.status)}</td><td><div class="row">${a.status==='접수'?`<button class="btn primary" onclick="approve(${a.id})">승인</button><button class="btn danger" onclick="rejectA(${a.id})">거절</button>`:''}${a.status==='승인'?`<button class="btn outline" onclick="showParticipation(${a.id})">참여링크</button>`:''}${a.status==='입금대기'?`<button class="btn primary" onclick="paid(${a.id})">입금확인</button>`:''}${a.status==='확정'?`<button class="btn outline" onclick="attendance(${a.id},true)">참석</button><button class="btn danger" onclick="attendance(${a.id},false)">불참</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="6">조건에 맞는 신청자가 없습니다.</td></tr>'}
async function approve(id){try{let j=await api(`/api/admin/applications/${id}/approve`,{method:'POST'});toast('승인되었습니다.');await loadPage();modal('참여 의사 확인 링크',`<p class="muted">카카오 알림톡 연동 전에는 아래 링크를 직접 전달할 수 있습니다.</p><div class="linkbox">${location.origin+j.participationPath}</div>`)}catch(e){alert(e.message)}}
async function rejectA(id){if(!confirm('거절 처리할까요?'))return;try{await api(`/api/admin/applications/${id}/reject`,{method:'POST'});toast('거절 처리했습니다.');loadPage()}catch(e){alert(e.message)}}
function showParticipation(id){modal('참여 링크 안내','<p class="muted">보안을 위해 승인 버튼을 눌렀을 때 반환된 일회용 링크를 전달하세요. 실제 알림톡 연동 시 이 과정은 자동 발송으로 대체합니다.</p>')}
async function paid(id){if(!confirm('실제 입금을 확인했습니까? 정원은 이 순간 다시 검사됩니다.'))return;try{let j=await api(`/api/admin/applications/${id}/mark-paid`,{method:'POST'});toast('입금 처리: '+j.status);loadPage()}catch(e){alert(e.message)}}
async function attendance(id,v){try{let j=await api(`/api/admin/applications/${id}/attendance`,{method:'POST',body:JSON.stringify({attended:v})});toast(j.status+' 처리했습니다.');await loadPage();if(j.reviewPath)modal('평가 링크',`<div class="linkbox">${location.origin+j.reviewPath}</div>`)}catch(e){alert(e.message)}}
function drawSchedules(){document.getElementById('main').innerHTML=head('운영','일정 관리','담당 모임체의 일정을 등록·수정·취소합니다.')+`<div class="toolbar"><span class="spacer"></span><button class="btn primary" onclick="scheduleForm()">＋ 일정 등록</button></div><div class="cards">${S.schedules.map(s=>`<div class="card"><div class="row"><h3>${esc(s.group_name)}</h3>${badge(s.cancelled?'취소':s.confirmed>=s.capacity?'마감':'모집')}</div><div class="meta">${esc(s.date)} · ${esc(s.start_time)}~${esc(s.end_time)}<br>${esc(s.place)}<br>확정 ${s.confirmed}/${s.capacity} · ${won(s.fee)}</div><div class="row end"><button class="btn outline" onclick="scheduleForm(${s.id})" ${s.cancelled?'disabled':''}>수정</button><button class="btn danger" onclick="cancelSchedule(${s.id})" ${s.cancelled?'disabled':''}>취소</button></div></div>`).join('')||'<div class="notice">등록된 일정이 없습니다.</div>'}</div>`}
function scheduleForm(id){let s=S.schedules.find(x=>x.id===id)||{};modal(id?'일정 수정':'일정 등록',`<div class="grid2"><div class="field full"><label>모임체</label><select class="input" id="sfG" ${id?'disabled':''}>${S.groups.map(g=>`<option value="${g.id}" ${g.id===s.group_id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div><div class="field"><label>날짜</label><input class="input" id="sfD" type="date" value="${s.date||''}"></div><div class="field"><label>장소</label><input class="input" id="sfP" value="${esc(s.place||'')}"></div><div class="field"><label>시작</label><input class="input" id="sfS" type="time" value="${s.start_time||''}"></div><div class="field"><label>종료</label><input class="input" id="sfE" type="time" value="${s.end_time||''}"></div><div class="field"><label>정원</label><input class="input" id="sfC" type="number" value="${s.capacity||3}"></div><div class="field"><label>참가비</label><input class="input" id="sfF" type="number" value="${s.fee||0}"></div></div><div class="row end"><button class="btn outline" onclick="closeModal()">닫기</button><button class="btn primary" onclick="saveSchedule(${id||0})">저장</button></div>`)}
async function saveSchedule(id){let body={group_id:Number(val('sfG')),date:val('sfD'),place:val('sfP'),start_time:val('sfS'),end_time:val('sfE'),capacity:Number(val('sfC')),fee:Number(val('sfF'))};try{await api(id?`/api/admin/schedules/${id}`:'/api/admin/schedules',{method:id?'PATCH':'POST',body:JSON.stringify(body)});closeModal();toast('일정을 저장했습니다.');loadPage()}catch(e){alert(e.message)}}
async function cancelSchedule(id){if(!confirm('일정을 취소하면 확정자는 환불 목록으로 이동합니다. 계속할까요?'))return;try{let j=await api(`/api/admin/schedules/${id}/cancel`,{method:'POST'});toast(`일정 취소 · 환불 대상 ${j.refundCount}명`);loadPage()}catch(e){alert(e.message)}}
function drawGroups(){document.getElementById('main').innerHTML=head('총괄자','모임체 관리','홈페이지에 노출되는 모임체를 DB에서 관리합니다.')+`<div class="toolbar"><span class="spacer"></span><button class="btn primary" onclick="groupForm()">＋ 모임체 등록</button></div><div class="tableWrap"><table class="table"><thead><tr><th>모임체</th><th>장소</th><th>참가비</th><th>운영자</th><th>노출/상태</th><th>관리</th></tr></thead><tbody>${S.groups.map(g=>`<tr><td><b>${esc(g.icon)} ${esc(g.name)}</b><div class="meta">${esc(g.field)} · ${esc(g.tag)}</div></td><td>${esc(g.place)}</td><td>${won(g.fee)}</td><td>${g.operators.map(o=>esc(o.name)).join(', ')||'미배정'}</td><td>${g.exposed?'노출':'숨김'} · ${badge(g.status)}</td><td><button class="btn outline" onclick="groupForm(${g.id})">수정</button> <button class="btn danger" onclick="closeGroup(${g.id})" ${g.status==='폐쇄'?'disabled':''}>폐쇄</button></td></tr>`).join('')}</tbody></table></div>`}
function groupForm(id){let g=S.groups.find(x=>x.id===id)||{};modal(id?'모임체 수정':'모임체 등록',`<div class="grid2"><div class="field full"><label>모임체명</label><input class="input" id="gfN" value="${esc(g.name||'')}"></div><div class="field"><label>분야</label><select class="input" id="gfField"><option ${g.field==='만들기'?'selected':''}>만들기</option><option ${g.field==='배우기'?'selected':''}>배우기</option></select></div><div class="field"><label>태그</label><input class="input" id="gfTag" value="${esc(g.tag||'')}"></div><div class="field"><label>아이콘</label><input class="input" id="gfIcon" value="${esc(g.icon||'✨')}"></div><div class="field"><label>동네</label><input class="input" id="gfPlace" value="${esc(g.place||'')}"></div><div class="field"><label>소요시간</label><input class="input" id="gfDur" value="${esc(g.duration||'')}"></div><div class="field"><label>참가비</label><input class="input" id="gfFee" type="number" value="${g.fee||0}"></div><div class="field full"><label>한 줄 소개</label><input class="input" id="gfTagline" value="${esc(g.tagline||'')}"></div><div class="field full"><label>소개</label><textarea class="input" id="gfIntro">${esc(g.intro||'')}</textarea></div><div class="field"><label>진행자/업체명</label><input class="input" id="gfHost" value="${esc(g.host_name||'')}"></div><div class="field"><label>진행자 설명</label><input class="input" id="gfHostRole" value="${esc(g.host_role||'')}"></div><div class="field full"><label>진행 순서 (한 줄에 하나)</label><textarea class="input" id="gfOrder">${esc((()=>{try{return JSON.parse(g.order_json||'[]').join('\n')}catch(e){return ''}})())}</textarea></div><div class="field full"><label>준비물 (한 줄에 하나)</label><textarea class="input" id="gfPrep">${esc((()=>{try{return JSON.parse(g.prep_json||'[]').join('\n')}catch(e){return ''}})())}</textarea></div><div class="field full"><label>환불 규정</label><textarea class="input" id="gfRefund">${esc(g.refund_policy||'')}</textarea></div><div class="field full"><label>FAQ (질문 | 답변 형식, 한 줄에 하나)</label><textarea class="input" id="gfFaq">${esc((()=>{try{return JSON.parse(g.faq_json||'[]').map(x=>x[0]+' | '+x[1]).join('\n')}catch(e){return ''}})())}</textarea></div><div class="field"><label>노출</label><select class="input" id="gfExp"><option value="1" ${g.exposed!==false?'selected':''}>노출</option><option value="0" ${g.exposed===false?'selected':''}>숨김</option></select></div><div class="field"><label>상태</label><select class="input" id="gfStatus">${['운영','일시중지','폐쇄'].map(x=>`<option ${g.status===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="row end"><button class="btn outline" onclick="closeModal()">닫기</button><button class="btn primary" onclick="saveGroup(${id||0})">저장</button></div>`)}
async function saveGroup(id){let body={name:val('gfN'),field:val('gfField'),tag:val('gfTag'),icon:val('gfIcon'),place:val('gfPlace'),duration:val('gfDur'),fee:Number(val('gfFee')),tagline:val('gfTagline'),intro:val('gfIntro'),host_name:val('gfHost'),host_role:val('gfHostRole'),order:val('gfOrder').split(/\n/).map(x=>x.trim()).filter(Boolean),prep:val('gfPrep').split(/\n/).map(x=>x.trim()).filter(Boolean),refund_policy:val('gfRefund'),faq:val('gfFaq').split(/\n/).map(x=>x.split('|').map(v=>v.trim())).filter(x=>x.length>=2&&x[0]&&x[1]),exposed:val('gfExp')==='1',status:val('gfStatus')};try{await api(id?`/api/admin/groups/${id}`:'/api/admin/groups',{method:id?'PATCH':'POST',body:JSON.stringify(body)});closeModal();toast('모임체를 저장했습니다.');loadPage()}catch(e){alert(e.message)}}
async function closeGroup(id){if(!confirm('폐쇄하면 노출이 꺼지고 예정 일정이 취소되며 확정자는 환불 목록으로 이동합니다.'))return;try{let j=await api(`/api/admin/groups/${id}/close`,{method:'POST'});toast(`폐쇄 완료 · 환불 대상 ${j.refundCount}명`);loadPage()}catch(e){alert(e.message)}}
function drawOperators(){document.getElementById('main').innerHTML=head('총괄자','운영자 계정','회원가입 대신 총괄자가 실제 로그인 가능한 운영자 계정을 발급합니다.')+`<div class="toolbar"><span class="spacer"></span><button class="btn primary" onclick="operatorForm()">＋ 운영자 계정 생성</button></div><div class="tableWrap"><table class="table"><thead><tr><th>운영자</th><th>담당 모임체</th><th>상태</th><th>마지막 로그인</th><th>관리</th></tr></thead><tbody>${S.operators.map(o=>`<tr><td><b>${esc(o.name)}</b><div class="meta">${esc(o.username)}</div></td><td>${o.group_ids.map(id=>S.groups.find(g=>g.id===id)?.name).filter(Boolean).map(esc).join(', ')||'미배정'}</td><td>${o.active?badge('활성'):badge('비활성')} ${o.must_change_password?badge('임시비밀번호'):''}</td><td>${esc(o.last_login||'-')}</td><td><button class="btn outline" onclick="editOperator(${o.id})">담당수정</button> <button class="btn amber" onclick="resetPw(${o.id})">비밀번호</button> <button class="btn ${o.active?'danger':'outline'}" onclick="toggleOperator(${o.id},${!o.active})">${o.active?'비활성화':'활성화'}</button></td></tr>`).join('')}</tbody></table></div>`}
function operatorForm(){modal('운영자 계정 생성',`<div class="grid2"><div class="field"><label>이름</label><input class="input" id="ofN"></div><div class="field"><label>아이디</label><input class="input" id="ofU"></div><div class="field full"><label>임시 비밀번호 (8자 이상)</label><input class="input" id="ofP" type="password"></div><div class="field full"><label>담당 모임체</label><div class="checks">${S.groups.map(g=>`<label><input type="checkbox" name="ofG" value="${g.id}"> ${esc(g.name)}</label>`).join('')}</div></div></div><div class="row end"><button class="btn outline" onclick="closeModal()">닫기</button><button class="btn primary" onclick="createOperator()">계정 생성</button></div>`)}
async function createOperator(){let ids=[...document.querySelectorAll('input[name=ofG]:checked')].map(x=>Number(x.value));try{await api('/api/admin/operators',{method:'POST',body:JSON.stringify({name:val('ofN'),username:val('ofU'),password:val('ofP'),group_ids:ids})});closeModal();toast('운영자 계정을 만들었습니다.');loadPage()}catch(e){alert(e.message)}}
function editOperator(id){let o=S.operators.find(x=>x.id===id);modal('담당 모임체 수정',`<div class="checks">${S.groups.map(g=>`<label><input type="checkbox" name="eg" value="${g.id}" ${o.group_ids.includes(g.id)?'checked':''}> ${esc(g.name)}</label>`).join('')}</div><div class="row end"><button class="btn outline" onclick="closeModal()">닫기</button><button class="btn primary" onclick="saveOperatorGroups(${id})">저장</button></div>`)}
async function saveOperatorGroups(id){let ids=[...document.querySelectorAll('input[name=eg]:checked')].map(x=>Number(x.value));try{await api(`/api/admin/operators/${id}`,{method:'PATCH',body:JSON.stringify({group_ids:ids})});closeModal();toast('담당 모임체를 저장했습니다.');loadPage()}catch(e){alert(e.message)}}
async function toggleOperator(id,active){try{await api(`/api/admin/operators/${id}`,{method:'PATCH',body:JSON.stringify({active})});toast('계정 상태를 변경했습니다.');loadPage()}catch(e){alert(e.message)}}
function resetPw(id){modal('임시 비밀번호 재발급',`<div class="field"><label>새 임시 비밀번호 (8자 이상)</label><input class="input" id="rp" type="password"></div><div class="row end"><button class="btn outline" onclick="closeModal()">닫기</button><button class="btn primary" onclick="doReset(${id})">재발급</button></div>`)}
async function doReset(id){try{await api(`/api/admin/operators/${id}/reset-password`,{method:'POST',body:JSON.stringify({password:val('rp')})});closeModal();toast('비밀번호를 재발급했습니다.');loadPage()}catch(e){alert(e.message)}}
function drawRefunds(){document.getElementById('main').innerHTML=head('총괄자','환불 필요 목록','정원 초과 입금·일정 취소·모임체 폐쇄 건을 관리합니다.')+`<div class="stats"><div class="stat"><b>${S.refunds.filter(x=>x.status==='대기').length}</b><span>대기</span></div><div class="stat"><b>${won(S.refunds.filter(x=>x.status==='대기').reduce((a,b)=>a+b.amount,0))}</b><span>대기 금액</span></div></div><div class="tableWrap"><table class="table"><thead><tr><th>신청자</th><th>모임</th><th>사유</th><th>금액</th><th>상태</th><th>처리</th></tr></thead><tbody>${S.refunds.map(r=>`<tr><td>${esc(r.name||'-')}<div class="meta">${esc(r.phone||'')}</div></td><td>${esc(r.group_name||'-')}<div class="meta">${esc(r.date||'')} ${esc(r.start_time||'')}</div></td><td>${esc(r.reason)}</td><td>${won(r.amount)}</td><td>${badge(r.status)}</td><td>${r.status==='대기'?`<button class="btn primary" onclick="finishRefund(${r.id})">처리완료</button>`:'-'}</td></tr>`).join('')}</tbody></table></div>`}
async function finishRefund(id){if(!confirm('실제 환불 처리가 끝났습니까?'))return;try{await api(`/api/admin/refunds/${id}/complete`,{method:'POST'});toast('환불 완료로 기록했습니다.');loadPage()}catch(e){alert(e.message)}}
function drawReviews(){document.getElementById('main').innerHTML=head('총괄자','평가 원문','참석자 평가를 실제 DB에서 확인합니다.')+`<div class="cards">${S.reviews.map(r=>`<div class="card"><h3>${esc(r.group_name)} · ${esc(r.applicant_name)}</h3><div class="meta">만족 ${r.satisfaction} · 재참여 ${r.revisit} · 진행 ${r.progress} · 장소 ${r.place} · 가격 ${r.value}<br>${esc(r.submitted_at)}</div><p>${esc(r.text)}</p>${r.report?`<div class="notice" style="background:var(--dangerSoft)"><b>문제 신고</b> ${esc(r.report_text)}</div>`:''}</div>`).join('')||'<div class="notice">아직 평가가 없습니다.</div>'}</div>`}
function modal(title,body){let d=document.createElement('div');d.id='modalBack';d.className='modalBack';d.innerHTML=`<div class="modal"><h2>${title}</h2>${body}</div>`;d.onclick=e=>{if(e.target===d)d.remove()};document.body.appendChild(d)}function closeModal(){document.getElementById('modalBack')?.remove()}
boot();
</script></body></html>
