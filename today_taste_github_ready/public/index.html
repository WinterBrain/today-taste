<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>오늘의 취향</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div class="stage" id="stage"><div id="app"><div class="state-screen"><div class="icwrap">⏳</div><h2>모임 정보를 불러오고 있어요</h2></div></div></div>
<script>
(function(){
'use strict';
let GROUPS=[];
const MBTI=['ISTJ','ISFJ','INFJ','INTJ','ISTP','ISFP','INFP','INTP','ESTP','ESFP','ENFP','ENTP','ESTJ','ESFJ','ENFJ','ENTJ'];
const DAYS=['평일','토','일'], BANDS=['오전','오후','저녁'];
const TINTS={clay:{bg:'#EFDDD2',ink:'#7A4A2E'},forest:{bg:'#DCE8DE',ink:'#2C5D3E'},plum:{bg:'#E9DCE6',ink:'#6B3C60'},mist:{bg:'#DCE4EA',ink:'#39586E'},sand:{bg:'#EFE6D2',ink:'#8A6A22'},slate:{bg:'#E2E4E1',ink:'#464E4A'}};
const tintKeys=['clay','forest','plum','mist','sand','slate'];
const S={route:'home',params:{},homeTab:'전체',selectedCells:new Set(),entryGroupId:null,recGroupIds:[],randomLastId:null,selGroupId:null,selScheduleId:null,pickMethod:'직접 선택',expandRest:false,form:{name:'',age:'',job:'',mbti:'',phone:'',agreeRequired:false,agreeMarketing:false},ad:{source:'직접/기타'},appliedSummary:null,openFaq:{}};
const app=()=>document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const won=n=>(Number(n)||0).toLocaleString('ko-KR')+'원';
function byId(id){return GROUPS.find(g=>String(g.id)===String(id))||null}
function dow(d){let w=new Date(d+'T00:00:00').getDay();return w===0?'일':w===6?'토':'평일'}
function dowFull(d){return ['일','월','화','수','목','금','토'][new Date(d+'T00:00:00').getDay()]}
function band(t){let h=parseInt(String(t).split(':')[0]||0,10);return h>=9&&h<12?'오전':h>=12&&h<18?'오후':'저녁'}
function fmtDate(d){let x=new Date(d+'T00:00:00');return (x.getMonth()+1)+'월 '+x.getDate()+'일('+dowFull(d)+')'}
function cellKey(s){return dow(s.date)+'|'+band(s.start_time)}
function isFull(s){return Number(s.remaining)<=0}
function seatLeft(s){return Math.max(0,Number(s.remaining)||0)}
function groupHasOpenSchedule(g){return g.schedules.some(s=>!isFull(s))}
function groupMatchesCells(g,set){return g.schedules.some(s=>set.has(cellKey(s))&&!isFull(s))}
function parseJSON(v,fallback){try{return Array.isArray(v)?v:JSON.parse(v||'')}catch(e){return fallback}}
function normalize(g,i){return {...g,tint:tintKeys[i%tintKeys.length],order:parseJSON(g.order_json,[]),prep:parseJSON(g.prep_json,[]),faq:parseJSON(g.faq_json,[]),refund:g.refund_policy||'환불 규정은 운영자에게 문의해 주세요.',hostName:g.host_name||'오늘의 취향 운영진',hostRole:g.host_role||'운영진 확인 완료'}}
(function captureAd(){try{let p=new URLSearchParams(location.search);S.ad={source:p.get('utm_source')||'직접/기타',medium:p.get('utm_medium')||'',campaign:p.get('utm_campaign')||'',content:p.get('utm_content')||'',fbclid:p.get('fbclid')||''}}catch(e){}})();
let hist=['home:{}'];
function go(route,params){S.route=route;S.params=params||{};hist.push(route+':'+JSON.stringify(S.params));document.getElementById('stage').scrollTo?.(0,0);window.scrollTo(0,0);render()}
function goBack(){if(hist.length>1){hist.pop();let v=hist[hist.length-1],i=v.indexOf(':');S.route=v.slice(0,i);S.params=JSON.parse(v.slice(i+1));render()}else{S.route='home';S.params={};render()}}
function appbar(title,opts={}){let back=opts.noBack?'':'<button class="back" data-back><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>';return '<div class="appbar '+(opts.line?'line':'')+'">'+back+'<div class="title">'+esc(title)+'</div>'+(opts.right||'<span style="width:34px"></span>')+'</div>'}
function progressBar(step){return '<div class="progress">'+[1,2,3,4].map(i=>'<i class="'+(i<=step?'on':'')+'"></i>').join('')+'</div>'}
function faqItem(scope,i,q,a){let k=scope+i,open=!!S.openFaq[k];return '<div class="faq-item '+(open?'open':'')+'" data-faq="'+esc(k)+'"><div class="faq-q">'+esc(q)+'<span class="x">+</span></div><div class="faq-a">'+esc(a)+'</div></div>'}
function gcard(g){let t=TINTS[g.tint]||TINTS.slate,open=groupHasOpenSchedule(g);return '<div class="gcard" data-open-detail="'+g.id+'"><div class="thumb" style="--tint:'+t.bg+';--tint-ink:'+t.ink+'">'+esc(g.icon||'✨')+'</div><div class="body"><div class="top"><span class="field-tag">'+esc(g.field)+' · '+esc(g.tag)+'</span>'+(open?'':'<span class="closed-chip">마감</span>')+'</div><h3>'+esc(g.name)+'</h3><div class="tagline">'+esc(g.tagline||'')+'</div><div class="meta"><span>'+esc(g.duration)+'</span><span>·</span><span>'+esc(g.place)+'</span><span>·</span><span class="fee">'+won(g.fee)+'</span></div></div></div>'}
function screenHome(){let list=GROUPS.filter(g=>S.homeTab==='전체'||g.field===S.homeTab);let h='<div class="appbar"><div class="wordmark">오늘의<span class="dot">·</span>취향</div><a href="/admin.html" style="font-size:11px;color:var(--ink-faint)">운영콘솔</a></div>';
h+='<div class="hero"><span class="eyebrow">승인제 원데이 모임</span><h1>검증된 모임, 오늘 하루,<br>새로운 취향을 만나요</h1><p class="sub">운영진이 확인하고 검증한 원데이 모임을 소규모로 즐겨요</p><div class="badge-row"><span class="pill"><b>최대 3인</b> · 운영자 검토 후 확정</span></div><div class="hero-cta"><button class="btn btn-primary" data-start-apply>나에게 맞는 모임 찾기</button></div></div>';
h+='<div class="trust-row"><div class="trust-card"><div class="n">최대 3인</div><div class="t">대화와 실습이 충분한 소규모</div></div><div class="trust-card"><div class="n">검증된 모임체</div><div class="t">운영진이 확인한 모임</div></div><div class="trust-card"><div class="n">승인제</div><div class="t">운영자 검토 후 확정</div></div></div><div style="height:24px"></div>';
if(GROUPS.length)h+='<button class="random-strip" data-home-random><div class="ic">🎲</div><div class="tx"><b>오늘은 뭘 해볼까 고민된다면</b><span>모임체 하나를 랜덤으로 보여드려요</span></div><div>›</div></button>';
h+='<div class="section" style="padding-top:0"><div class="section-head"><h2>모임체 둘러보기</h2></div><div class="tabs">'+['전체','만들기','배우기'].map(t=>'<button class="tab '+(S.homeTab===t?'active':'')+'" data-home-tab="'+t+'">'+t+'</button>').join('')+'</div></div>';
h+='<div class="glist" style="margin-bottom:30px">'+(list.length?list.map(gcard).join(''):'<div class="empty-state"><div class="ic">🌿</div><h3>현재 공개된 모임이 없어요</h3><p>운영콘솔에서 모임체와 일정을 등록하면 여기에 표시돼요.</p></div>')+'</div>';
h+='<div class="section"><div class="section-head"><h2>참여 방법</h2></div><ul class="steps-num"><li><div class="t"><b>참여 신청</b> — 가능한 시간대를 고르고 모임을 선택해요</div></li><li><div class="t"><b>운영자 검토</b> — 담당 운영자가 신청 내용을 확인해요</div></li><li><div class="t"><b>선정 안내</b> — 참여 의사를 확인해요</div></li><li><div class="t"><b>입금</b> — 10시간 안에 입금하면 확정돼요</div></li><li><div class="t"><b>모임 당일</b> — 작은 테이블에서 새로운 취향을 만나요</div></li></ul></div>';
h+='<div class="section"><div class="verify-box"><h4>운영진이 확인한 모임이에요</h4><p>모임 구성과 장소를 확인한 뒤 등록하고, 운영 기록과 평가를 바탕으로 계속 점검해요.</p></div></div>';
let faqs=[['혼자 신청해도 되나요?','네, 대부분 혼자 오세요. 최대 3인이라 자연스럽게 이야기 나누게 돼요.'],['신청하면 바로 확정인가요?','아니에요. 담당 운영자가 검토해 승인한 뒤 참여 의사를 확인하고 입금이 확인되면 확정돼요.'],['입금은 어떻게 하나요?','현재 테스트 버전은 운영자가 입금 확인을 처리하며, 실제 PG 연동 후 가상계좌 자동 확인으로 교체할 수 있어요.'],['취소나 환불은 어떻게 하나요?','모임체 상세 페이지의 환불 규정을 확인해 주세요.']];
h+='<div class="section" style="padding-bottom:40px"><div class="section-head"><h2>자주 묻는 질문</h2></div>'+faqs.map((f,i)=>faqItem('home',i,f[0],f[1])).join('')+'</div><div style="padding:10px 18px 46px;text-align:center;color:var(--ink-faint);font-size:13.5px;font-family:\'Gowun Batang\',serif">이번 주, 작은 모임 하나 어떠세요?</div>';return h}
function screenDetail(){let g=byId(S.params.id)||GROUPS[0];if(!g)return screenHome();let t=TINTS[g.tint]||TINTS.slate,open=groupHasOpenSchedule(g);let h=appbar(g.name);h+='<div class="hero-img" style="--tint:'+t.bg+'"><div class="emoji">'+esc(g.icon)+'</div><div class="fade"></div><div class="badges"><span class="badge-dark">승인제</span><span class="badge-dark">최대 3인</span></div></div>';
h+='<div class="detail-head"><span class="field-tag">'+esc(g.field)+' · '+esc(g.tag)+'</span><h1>'+esc(g.name)+'</h1><div class="tagline">'+esc(g.tagline)+'</div><div class="info-grid"><div class="info-cell"><div class="k">소요시간</div><div class="v">'+esc(g.duration)+'</div></div><div class="info-cell"><div class="k">장소</div><div class="v">'+esc(g.place)+' 인근</div></div><div class="info-cell"><div class="k">참가비</div><div class="v">'+won(g.fee)+'</div></div><div class="info-cell"><div class="k">진행 방식</div><div class="v">운영진 검토 후 확정</div></div></div></div>';
h+='<div class="section"><div class="verify-box"><h4>운영진이 확인한 모임이에요</h4><p>구성과 장소를 운영진이 확인한 뒤 공개한 모임입니다.</p></div></div><div class="section"><div class="section-head"><h2>소개</h2></div><p style="font-size:13.5px;color:var(--ink-soft);line-height:1.75">'+esc(g.intro||'소개가 준비 중입니다.')+'</p></div>';
if(g.order.length)h+='<div class="section"><div class="section-head"><h2>진행 순서</h2></div><ul class="steps-num">'+g.order.map(x=>'<li><div class="t">'+esc(x)+'</div></li>').join('')+'</ul></div>';
if(g.prep.length)h+='<div class="section"><div class="section-head"><h2>준비물</h2></div><div class="taglist">'+g.prep.map(x=>'<span>'+esc(x)+'</span>').join('')+'</div></div>';
h+='<div class="section"><div class="section-head"><h2>일정</h2></div><div class="sched-list">'+(g.schedules.length?g.schedules.map(s=>'<div class="sched-item '+(isFull(s)?'full':'')+'"><div><div class="d">'+fmtDate(s.date)+' '+esc(s.start_time)+'~'+esc(s.end_time)+'</div><div class="m">'+esc(s.place)+' · '+dow(s.date)+' '+band(s.start_time)+'</div></div><div class="r">'+(isFull(s)?'<span class="full-tag">마감</span>':'<span class="seat '+(seatLeft(s)===1?'low':'')+'">잔여 '+seatLeft(s)+'자리</span>')+'</div></div>').join(''):'<div class="empty-state" style="padding:25px"><p>등록된 예정 일정이 없어요.</p></div>')+'</div></div>';
h+='<div class="section"><div class="section-head"><h2>운영자</h2></div><div class="host-row"><div class="av">🧑‍💼</div><div><div class="n">'+esc(g.hostName)+'</div><div class="r">'+esc(g.hostRole)+'</div></div></div></div><div class="section"><div class="section-head"><h2>신청 절차</h2></div><ul class="steps-num">'+['참여 신청','운영자 검토','선정 안내','입금 (10시간 안)','모임 당일'].map(x=>'<li><div class="t">'+x+'</div></li>').join('')+'</ul></div>';
h+='<div class="section"><div class="section-head"><h2>환불 규정</h2></div><div class="refund-box">'+esc(g.refund)+'</div></div>';if(g.faq.length)h+='<div class="section" style="padding-bottom:20px"><div class="section-head"><h2>자주 묻는 질문</h2></div>'+g.faq.map((f,i)=>faqItem('detail'+g.id,i,f[0],f[1])).join('')+'</div>';
h+='<div class="bottom-bar"><div class="price"><span class="l">참가비</span><span class="v">'+won(g.fee)+'</span></div><button class="btn btn-primary" data-apply-from-detail="'+g.id+'" '+(open?'':'disabled')+'>'+(open?'신청하기':'마감된 모임체예요')+'</button></div>';return h}
function screenApply1(){return appbar('참여 가능 시간대',{line:true})+progressBar(1)+'<div class="apply-head"><h2>언제 시간이 되세요?</h2><p>선택한 시간대에 운영되는 모임체를 추천해 드려요. 여러 칸을 고를 수 있어요.</p></div><div class="matrix"><table><thead><tr><th></th>'+BANDS.map(b=>'<th>'+b+'</th>').join('')+'</tr></thead><tbody>'+DAYS.map(d=>'<tr><td class="rowlabel">'+d+'</td>'+BANDS.map(b=>{let k=d+'|'+b;return '<td><div class="cell '+(S.selectedCells.has(k)?'on':'')+'" data-cell="'+k+'"><span class="dot"></span></div></td>'}).join('')+'</tr>').join('')+'</tbody></table></div><div class="pad" style="color:var(--ink-faint);font-size:11.5px;margin-top:-6px">최소 1칸 이상 선택해야 다음으로 넘어갈 수 있어요</div><div class="bottom-bar"><button class="btn btn-primary btn-block" data-apply1-next '+(S.selectedCells.size?'':'disabled')+'>다음</button></div>'}
function screenApply2(){let recs=GROUPS.filter(g=>groupMatchesCells(g,S.selectedCells));S.recGroupIds=recs.map(g=>g.id);let h=appbar('추천 모임체',{line:true})+progressBar(2)+'<div class="apply-head"><h2>이런 모임체는 어때요?</h2><p>고른 시간대에 신청 가능한 일정이 있는 모임체예요.</p></div>';if(!recs.length)return h+'<div class="empty-state"><div class="ic">🗓️</div><h3>선택한 시간대에 열리는 모임체가 아직 없어요</h3><p>다른 시간대를 골라보세요.</p><div class="actions"><button class="btn btn-outline btn-block" data-back-to-1>시간대 다시 고르기</button></div></div>';if(recs.length>=2)h+='<div class="pad" style="margin-bottom:14px"><button class="btn btn-outline btn-block" data-random-in-rec>🎲 이 중에서 랜덤으로 골라줘</button></div>';h+='<div class="rec-grid">'+recs.map(g=>'<div>'+(g.id===S.randomLastId?'<div style="font-size:11px;color:var(--brand-ink);font-weight:700;margin-bottom:4px">🎲 방금 랜덤으로 뽑혔어요</div>':'')+gcard(g)+'</div>').join('')+'</div>';return h}
function screenApply3(){let g=byId(S.selGroupId);if(!g)return screenApply2();let matched=g.schedules.filter(s=>S.selectedCells.has(cellKey(s))),rest=g.schedules.filter(s=>!matched.includes(s));function row(s){return '<div class="sched-item '+(isFull(s)?'full':'')+' '+(String(S.selScheduleId)===String(s.id)?'match':'')+'" '+(isFull(s)?'':'data-pick-sched="'+s.id+'" style="cursor:pointer"')+'><div><div class="d">'+fmtDate(s.date)+' '+esc(s.start_time)+'~'+esc(s.end_time)+'</div><div class="m">'+esc(s.place)+' · '+dow(s.date)+' '+band(s.start_time)+' · '+won(s.fee)+'</div></div><div class="r">'+(isFull(s)?'<span class="full-tag">마감</span>':'<span class="seat '+(seatLeft(s)===1?'low':'')+'">잔여 '+seatLeft(s)+'자리</span>')+'</div></div>'}let h=appbar('날짜 선택',{line:true})+progressBar(3)+'<div class="apply-head"><h2>'+esc(g.name)+'</h2><p>참여할 일정을 골라주세요. 선택한 시간대에 맞는 일정을 먼저 보여드려요.</p></div><div class="pad"><div class="sched-list">'+matched.map(row).join('')+'</div></div>';if(rest.length){h+='<div class="pad" style="margin-top:10px"><button class="btn btn-ghost btn-sm" data-toggle-rest>'+(S.expandRest?'다른 일정 접기 ▲':'다른 일정 펼쳐 보기 ('+rest.length+') ▼')+'</button></div>';if(S.expandRest)h+='<div class="pad" style="margin-top:8px"><div class="sched-list">'+rest.map(row).join('')+'</div></div>'}h+='<div class="bottom-bar"><button class="btn btn-primary btn-block" data-apply3-next '+(S.selScheduleId?'':'disabled')+'>다음</button></div>';return h}
function screenApply4(){let g=byId(S.selGroupId),s=g?.schedules.find(x=>String(x.id)===String(S.selScheduleId)),f=S.form;let h=appbar('정보 입력',{line:true})+progressBar(4)+'<div class="apply-head"><h2>거의 다 왔어요</h2><p>운영자가 신청을 검토할 때 참고할 정보예요.</p></div>';if(g&&s)h+='<div class="pad" style="margin-bottom:8px"><div class="info-cell"><div class="k">신청할 모임</div><div class="v">'+esc(g.name)+'</div><div style="font-size:12px;color:var(--ink-soft);margin-top:2px">'+fmtDate(s.date)+' '+esc(s.start_time)+' · '+esc(s.place)+'</div></div></div>';h+='<div class="pad"><div class="field"><label>이름</label><input class="input" data-bind="name" value="'+esc(f.name)+'" placeholder="실명을 입력해 주세요"></div><div class="field"><label>나이 (만)</label><input class="input" type="number" inputmode="numeric" data-bind="age" value="'+esc(f.age)+'" placeholder="예: 27"><div class="hint">현재 기본 허용 범위: 만 19~35세</div></div><div class="field"><label>직업</label><div class="choice-row">'+['대학생','직장인','기타'].map(j=>'<button class="choice '+(f.job===j?'sel':'')+'" data-choice="job" data-val="'+j+'">'+j+'</button>').join('')+'</div></div><div class="field"><label>MBTI</label><div class="mbti-grid">'+MBTI.map(m=>'<button class="choice '+(f.mbti===m?'sel':'')+'" data-choice="mbti" data-val="'+m+'">'+m+'</button>').join('')+'<button class="choice wide '+(f.mbti==='모름'?'sel':'')+'" data-choice="mbti" data-val="모름">모름</button></div></div><div class="field"><label>전화번호</label><input class="input" type="tel" inputmode="numeric" data-bind="phone" value="'+esc(f.phone)+'" placeholder="010-0000-0000" maxlength="13"><div class="hint">선정·입금 안내를 위한 연락처예요</div></div><div class="notice-box"><b>신청 전 확인해 주세요.</b> 선정 안내 후 참여 의사를 확인하면 10시간 입금 기한이 시작돼요.</div><div class="agree-row"><input type="checkbox" '+(f.agreeRequired?'checked':'')+' data-agree="agreeRequired"><div class="tx"><span class="req">[필수]</span> <b>개인정보 수집·이용 및 이용약관 동의</b><a class="view" data-open-policy="privacy">전문 보기</a></div></div><div class="agree-row"><input type="checkbox" '+(f.agreeMarketing?'checked':'')+' data-agree="agreeMarketing"><div class="tx"><span class="opt">[선택]</span> 새로운 모임 소식 등 마케팅 정보 수신 동의</div></div></div>';let valid=f.name.trim()&&Number(f.age)>=19&&Number(f.age)<=35&&f.job&&f.mbti&&/^010-\d{4}-\d{4}$/.test(f.phone)&&f.agreeRequired;h+='<div class="bottom-bar"><button class="btn btn-primary btn-block" data-submit-apply '+(valid?'':'disabled')+'>신청서 제출하기</button></div>';return h}
function screenComplete(){let x=S.appliedSummary;if(!x)return screenHome();return appbar('신청 완료',{noBack:true})+'<div class="state-screen"><div class="icwrap">✅</div><h2>신청서가 접수됐어요</h2><p>담당 운영자가 신청 내용을 확인하고 있어요.<br>승인되면 참여 의사 확인 링크가 생성됩니다.</p><div class="receipt"><div class="row"><span class="k">접수번호</span><span class="v">#'+esc(x.id)+'</span></div><div class="row"><span class="k">모임체</span><span class="v">'+esc(x.groupName)+'</span></div><div class="row"><span class="k">일정</span><span class="v">'+esc(x.dateLabel)+'</span></div><div class="row"><span class="k">신청자</span><span class="v">'+esc(x.name)+'</span></div></div><div class="timer-box"><b>다음 순서</b><br>운영자 검토 → 참여 의사 확인 → 10시간 안 입금 → 참여 확정</div></div><div class="bottom-bar"><button class="btn btn-outline btn-block" data-back-home>다른 모임체 보기</button></div>'}
function screenPolicy(){let tab=S.params.tab||'privacy',h=appbar('개인정보 처리방침 · 이용약관',{line:true})+'<div class="tabs pad" style="padding-top:16px"><button class="tab '+(tab==='privacy'?'active':'')+'" data-policy-tab="privacy">개인정보 처리방침</button><button class="tab '+(tab==='terms'?'active':'')+'" data-policy-tab="terms">이용약관</button></div>';h+='<div class="policy-body">'+(tab==='privacy'?'<p>오늘의 취향은 신청자의 개인정보를 아래와 같이 수집·이용합니다.</p><h3>1. 수집 항목</h3><p>이름, 나이, 직업, MBTI, 전화번호, 참여 가능 시간대, 광고 유입 정보</p><h3>2. 이용 목적</h3><p>모임 신청 접수 및 승인, 참여 의사·입금 안내, 참석 확인, 평가 요청</p><h3>3. 운영자 공유</h3><p>신청자 정보는 로그인한 운영자에게 제공되며, 승인·일정·참석 처리는 담당 모임체 운영자가 수행합니다.</p><h3>4. 보관 기간</h3><p>현재 5년 기준으로 설계되어 있으며 실제 운영 전 법률 검토가 필요합니다.</p>':'<h3>제1조 (목적)</h3><p>이 약관은 오늘의 취향 원데이 모임 신청 서비스 이용 조건을 규정합니다.</p><h3>제2조 (신청 및 승인)</h3><p>신청은 회원가입 없이 제출할 수 있으며 담당 운영자의 검토를 거칩니다.</p><h3>제3조 (입금 및 확정)</h3><p>참여 의사 확인 후 10시간 이내 입금이 확인되어야 참여가 확정됩니다.</p><h3>제4조 (환불)</h3><p>모임체별 상세 환불 규정을 따르며 정원 초과 입금 등 시스템 사유의 환불은 환불 목록에서 관리합니다.</p>')+'</div>';return h}
function render(){let h;switch(S.route){case'home':h=screenHome();break;case'detail':h=screenDetail();break;case'apply1':h=screenApply1();break;case'apply2':h=screenApply2();break;case'apply3':h=screenApply3();break;case'apply4':h=screenApply4();break;case'complete':h=screenComplete();break;case'policy':h=screenPolicy();break;default:h=screenHome()}app().innerHTML=h}
async function submit(){let g=byId(S.selGroupId),s=g?.schedules.find(x=>String(x.id)===String(S.selScheduleId));let body={schedule_id:Number(S.selScheduleId),name:S.form.name.trim(),age:Number(S.form.age),job:S.form.job,mbti:S.form.mbti==='모름'?'':S.form.mbti,phone:S.form.phone,preferred_times:[...S.selectedCells],selection_method:S.pickMethod,ad_source:S.ad.source};try{let r=await fetch('/api/public/applications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),j=await r.json();if(!r.ok)throw new Error(j.error||'신청에 실패했습니다.');S.appliedSummary={id:j.id,groupName:g.name,dateLabel:fmtDate(s.date)+' '+s.start_time,name:S.form.name};go('complete')}catch(e){alert(e.message)}}
document.addEventListener('click',e=>{let t=e.target;if(t.closest('[data-back]'))return goBack();let x=t.closest('[data-open-detail]');if(x&&S.route==='apply2'){S.selGroupId=Number(x.dataset.openDetail);S.pickMethod=String(S.randomLastId)===String(S.selGroupId)?'랜덤':'직접 선택';S.selScheduleId=null;return go('apply3')}if(x)return go('detail',{id:Number(x.dataset.openDetail)});x=t.closest('[data-home-tab]');if(x){S.homeTab=x.dataset.homeTab;return render()}if(t.closest('[data-start-apply]')){S.entryGroupId=null;return go('apply1')}x=t.closest('[data-apply-from-detail]');if(x){S.entryGroupId=Number(x.dataset.applyFromDetail);return go('apply1')}if(t.closest('[data-home-random]')){let pool=GROUPS.filter(groupHasOpenSchedule);if(pool.length)return go('detail',{id:pool[Math.floor(Math.random()*pool.length)].id})}x=t.closest('[data-cell]');if(x){let k=x.dataset.cell;S.selectedCells.has(k)?S.selectedCells.delete(k):S.selectedCells.add(k);return render()}if(t.closest('[data-apply1-next]')){if(!S.selectedCells.size)return;if(S.entryGroupId){S.selGroupId=S.entryGroupId;S.selScheduleId=null;return go('apply3')}return go('apply2')}if(t.closest('[data-back-to-1]'))return go('apply1');if(t.closest('[data-random-in-rec]')){let pool=S.recGroupIds.filter(id=>String(id)!==String(S.randomLastId));if(!pool.length)pool=S.recGroupIds;S.randomLastId=pool[Math.floor(Math.random()*pool.length)];return render()}x=t.closest('[data-pick-sched]');if(x){S.selScheduleId=Number(x.dataset.pickSched);return render()}if(t.closest('[data-toggle-rest]')){S.expandRest=!S.expandRest;return render()}if(t.closest('[data-apply3-next]')&&S.selScheduleId)return go('apply4');x=t.closest('[data-choice]');if(x){S.form[x.dataset.choice]=x.dataset.val;return render()}if(t.closest('[data-submit-apply]')&&!t.closest('[data-submit-apply]').disabled)return submit();if(t.closest('[data-back-home]')){Object.assign(S,{route:'home',params:{},selectedCells:new Set(),entryGroupId:null,selGroupId:null,selScheduleId:null,randomLastId:null,appliedSummary:null,form:{name:'',age:'',job:'',mbti:'',phone:'',agreeRequired:false,agreeMarketing:false}});return render()}x=t.closest('[data-faq]');if(x){S.openFaq[x.dataset.faq]=!S.openFaq[x.dataset.faq];return render()}x=t.closest('[data-open-policy]');if(x)return go('policy',{tab:x.dataset.openPolicy});x=t.closest('[data-policy-tab]');if(x)return go('policy',{tab:x.dataset.policyTab})});
document.addEventListener('input',e=>{let t=e.target;if(!t.matches('[data-bind]'))return;let k=t.dataset.bind,v=t.value;if(k==='phone'){v=v.replace(/\D/g,'').slice(0,11);if(v.length>7)v=v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7);else if(v.length>3)v=v.slice(0,3)+'-'+v.slice(3);t.value=v}if(k==='age'){v=v.replace(/\D/g,'').slice(0,2);t.value=v}S.form[k]=v;let b=document.querySelector('[data-submit-apply]');if(b){let f=S.form;b.disabled=!(f.name.trim()&&Number(f.age)>=19&&Number(f.age)<=35&&f.job&&f.mbti&&/^010-\d{4}-\d{4}$/.test(f.phone)&&f.agreeRequired)}});
document.addEventListener('change',e=>{let t=e.target;if(t.matches('[data-agree]')){S.form[t.dataset.agree]=t.checked;render()}});
async function load(){try{let r=await fetch('/api/public/groups'),j=await r.json();if(!r.ok)throw new Error(j.error||'불러오기 실패');GROUPS=(j.groups||[]).map(normalize);render()}catch(e){app().innerHTML='<div class="state-screen"><div class="icwrap">⚠️</div><h2>서버에 연결할 수 없어요</h2><p>'+esc(e.message)+'</p></div>'}}
load();
})();
</script>
</body></html>
